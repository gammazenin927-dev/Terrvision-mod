name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q terrvision-mod.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        run: gradle -p terrvision-mod build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: terrvision-jar
          path: |
            terrvision-mod/build/libs/*.jar
            !terrvision-mod/build/libs/*-sources.jar
